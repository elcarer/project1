<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиксельный редактор — спрайты и анимации</title>
    <style>
        body {
            margin: 0;
            background: #0d0e11;
            color: #cfd8e3;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }
        h1 { font-size: 16px; margin: 0; color: #88ffcc; }
        .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        #board { border: 1px solid #2a2e36; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
        .panel {
            background: #171a20;
            border: 1px solid #2a2e36;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
        }
        .panel h2 { font-size: 12px; margin: 0; color: #88ffcc; text-transform: uppercase; }
        .swatch {
            width: 26px; height: 26px;
            border: 2px solid #2a2e36;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
        }
        .swatch.active { border-color: #88ffcc; }
        button {
            background: #22262e;
            color: #cfd8e3;
            border: 1px solid #2a2e36;
            border-radius: 4px;
            font-family: monospace;
            padding: 6px 10px;
            cursor: pointer;
        }
        button:hover { border-color: #88ffcc; }
        button.active { border-color: #88ffcc; color: #88ffcc; }
        #palette { display: grid; grid-template-columns: repeat(6, 26px); gap: 4px; }
        .tools { display: flex; gap: 4px; flex-wrap: wrap; }
        .tools button.active { border-color: #88ffcc; color: #88ffcc; }
        #frames { display: flex; gap: 6px; flex-wrap: wrap; }
        .thumb { width: 64px; height: 64px; border: 2px solid #2a2e36; cursor: pointer; image-rendering: pixelated; padding: 0; background: #15171b; }
        .thumb.active { border-color: #88ffcc; }
        .rowtab.active { border-color: #88ffcc; color: #88ffcc; }
        #colorInput { width: 100%; height: 30px; background: none; border: 1px solid #2a2e36; border-radius: 4px; cursor: pointer; }
        #name {
            background: #0d0e11;
            border: 1px solid #2a2e36;
            border-radius: 4px;
            color: #cfd8e3;
            font-family: monospace;
            padding: 6px;
            width: 160px;
        }
        #status { font-size: 12px; color: #88ffcc; min-height: 14px; }
    </style>
</head>
<body>
    <h1>Пиксельный редактор — персонажи и анимации (64×64, строка = анимация)</h1>
    <div class="row" style="align-items:center;">
        <span style="color:#88ffcc;">Анимации:</span>
        <div id="rows" class="tools"></div>
        <input id="rowName" placeholder="имя (wait/death...)" style="background:#0d0e11;border:1px solid #2a2e36;border-radius:4px;color:#cfd8e3;font-family:monospace;padding:4px 6px;width:150px;">
        <button id="addRow">+ строка</button>
    </div>
    <div id="frames"></div>
    <div class="row">
        <canvas id="board"></canvas>
        <div class="panel">
            <h2>Палитра</h2>
            <div id="palette"></div>
            <input type="color" id="colorInput" value="#9aa7b5">
            <div style="font-size:10px;color:#7a8494;">фон анимации</div>
            <input type="color" id="bgInput" value="#15171b">
            <h2>Инструменты</h2>
            <div class="tools">
                <button data-tool="pixel" class="active">пиксель</button>
                <button data-tool="fill">заливка</button>
                <button data-tool="eraser">ластик</button>
                <button data-tool="pick">пипетка</button>
            </div>
            <h2>Кадры</h2>
            <div class="tools">
                <button id="addFrame">дубль+</button>
                <button id="emptyFrame">пустой+</button>
                <button id="delFrame">удалить</button>
            </div>
            <div class="tools">
                <button id="clearFrame">очистить кадр</button>
                <button id="play">▶ проиграть</button>
                <input id="fpsInput" type="number" value="8" min="1" max="60" title="скорость анимации, кадров/с (пишется в манифест)" style="background:#0d0e11;border:1px solid #2a2e36;border-radius:4px;color:#cfd8e3;font-family:monospace;padding:6px;width:56px;">
                <span style="font-size:10px;color:#7a8494;">кадр/с</span>
            </div>
        </div>
        <div class="panel">
            <h2>Файл</h2>
            <button id="open">Открыть (выбор файла)</button>
            <input type="file" id="fileInput" accept=".png,.json" multiple style="display:none">
            <div style="font-size:10px;color:#7a8494;">выберите .png и рядом его .json</div>
            <h2>Размер</h2>
            <div class="tools">
                <input id="sizeInput" type="number" value="64" min="8" max="256" step="8" style="background:#0d0e11;border:1px solid #2a2e36;border-radius:4px;color:#cfd8e3;font-family:monospace;padding:6px;width:70px;">
                <button id="applySize">Применить</button>
            </div>
            <h2>Экспорт</h2>
            <input id="name" value="knight_64.png">
            <button id="export">Сохранить на сервер</button>
            <button id="download">Скачать (download)</button>
            <div id="status"></div>
        </div>
    </div>
    <div style="text-align:center;">
        <h1 style="margin-bottom:4px;">Спрайтшит целиком (клик по кадру — перейти к нему)</h1>
        <canvas id="sheetPreview" style="border:1px solid #2a2e36; image-rendering: pixelated; max-width: 96vw; height: auto; cursor: pointer;"></canvas>
    </div>
    <script src="./scripts/editor.js?v=9"></script>
</body>
</html>
