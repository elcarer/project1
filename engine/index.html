<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS + engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            /* Курсор игры (images/ui/cur.png, остриё в пикселе 0,0); при
               недоступности картинки браузер вернёт обычный стрелочный */
            cursor: url('./images/ui/cur.png') 0 0, auto;
        }
    </style>
    <!-- Отладка в средах без отрисовки (?raf=timeout): requestAnimationFrame на
         setTimeout — загрузка и тик игры идут без реальных кадров композитора
         (автотесты на скрытой/перекрытой панели). В обычном запуске не включается. -->
    <script>
        if (new URLSearchParams(location.search).get("raf") === "timeout") {
            window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
        }
    </script>
    <!-- ЛОКАЛЬНЫЙ PixiJS -->
    <script src="./dll/pixi.min.js"></script>
    <!-- ДВИЖОК в dual-mode (файлы без import/export — глобали): порядок важен.
         Работает и по http (python nocache-server.py), и двойным кликом с file://
         (ассеты для file:// вшиты в scripts/embedded_assets.js). -->
    <script src="./scripts/data/units.js"></script>
    <script src="./scripts/data/attacks.js"></script>
    <script src="./scripts/data/stats.js"></script>
    <script src="./scripts/data/abilities.js"></script>
    <script src="./scripts/data/heroes.js"></script>
    <script src="./scripts/data/enemies.js"></script>
    <script src="./scripts/data/quests.js"></script>
    <script src="./scripts/engine/eventSystem.js"></script>
    <script src="./scripts/engine/engine.js"></script>
    <script src="./scripts/engine/modules/math.js"></script>
    <script src="./scripts/engine/modules/pool.js"></script>
    <script src="./scripts/engine/modules/scheduler.js"></script>
    <script src="./scripts/engine/modules/input.js"></script>
    <script src="./scripts/engine/modules/camera.js"></script>
    <script src="./scripts/engine/modules/character.js"></script>
    <script src="./scripts/engine/modules/ai.js"></script>
    <script src="./scripts/engine/modules/projectiles.js"></script>
    <script src="./scripts/engine/modules/combat.js"></script>
    <script src="./scripts/engine/modules/abilities.js"></script>
    <script src="./scripts/engine/modules/quests.js"></script>
    <script src="./scripts/engine/modules/tilemap.js"></script>
    <script src="./scripts/engine/modules/health.js"></script>
    <script src="./scripts/engine/modules/fx.js"></script>
    <script src="./scripts/engine/modules/audio.js"></script>
    <script src="./scripts/engine/modules/assets.js"></script>
    <script src="./scripts/engine/modules/hud.js"></script>
    <script src="./scripts/engine/modules/scenes.js"></script>
    <script src="./scripts/engine/modules/debug.js"></script>
    <script src="./scripts/engine/modules/dualgrid.js"></script>
    <!-- Реестр объектов dualgrid (data-URL WebP) — глобаль DUALGRID_OBJECTS -->
    <script src="./images/objects/objects_data.js"></script>
    <!-- Вшитые ассеты для file:// (тайлсеты + оборотень; по http не используются) -->
    <script src="./scripts/embedded_assets.js"></script>
    <!-- Вшитые иконки способностей для file:// (генератор make_embedded_abilities.py) -->
    <script src="./scripts/embedded_abilities.js"></script>
    <!-- Игровой шрифт всех надписей (вшит base64 — работает и на file://) -->
    <script src="./scripts/game_font.js"></script>
</head>
<body>
    <!-- Игровая логика: классический скрипт, читает глобали движка -->
    <script src="./scripts/game.js"></script>
</body>
</html>
